name: Build ESP32-S3 Firmware
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Arduino CLI
        run: |
          curl -fsSL https://downloads.arduino.cc/arduino-cli/arduino-cli_0.35.3_Linux_64bit.tar.gz | tar -xz
          sudo mv arduino-cli /usr/local/bin/
          arduino-cli config init
          arduino-cli config set library.enable_unsafe_install true
      - name: Install ESP32 Core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
      - name: Compile Sketch
        run: |
          SKETCH_DIR=$(find . -name "*.ino" -exec dirname {} \; | head -n 1)
          echo "Found sketch directory: $SKETCH_DIR"
          arduino-cli compile --fqbn esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi "$SKETCH_DIR"
