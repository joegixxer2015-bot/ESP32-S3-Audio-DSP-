name: Build ESP32-S3 Firmware

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://downloads.arduino.cc/arduino-cli/arduino-cli_0.35.3_Linux_64bit.tar.gz | tar -xz
          sudo mv arduino-cli /usr/local/bin/
          arduino-cli config init

      - name: Install ESP32 Core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Compile Sketch
        run: |
          SKETCH_PATH=$(find . -name "*.ino" | head -n 1)
          SKETCH_DIR=$(dirname "$SKETCH_PATH")
          echo "Found sketch at: $SKETCH_PATH"
          echo "Found sketch directory: $SKETCH_DIR"
          
          mkdir -p ./build
          arduino-cli compile --fqbn esp32:esp32:esp32s3:FlashMode=dio,FlashSize=16M,PSRAM=opi --output-dir ./build "$SKETCH_DIR"

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: S3-N16R8-Firmware
          path: ./build/*.bin
