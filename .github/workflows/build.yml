name: Build ESP32-S3 Firmware

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Compile Sketch
        run: |
          # ค้นหาตำแหน่งโฟลเดอร์ที่มีไฟล์ .ino โดยอัตโนมัติ
          SKETCH_DIR=$(find . -name "*.ino" -exec dirname {} \; | head -n 1)
          echo "Found sketch directory: $SKETCH_DIR"
          arduino-cli compile --fqbn esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi "$SKETCH_DIR"
